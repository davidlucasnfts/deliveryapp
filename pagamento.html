<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração de Pagamento</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pagamento-style.css">
</head>
<body>
<div class="wrap">

  <!-- STATUS -->
  <div class="status-card" id="statusCard">
    <div class="s-icon" id="sIcon" style="background:#F3F4F6;">⚙️</div>
    <div class="s-info">
      <div class="s-title" id="sTitle">Pagamentos não configurados</div>
      <div class="s-sub" id="sSub">Escolha um gateway e configure suas credenciais</div>
    </div>
    <span class="s-pill pill-off" id="sPill">Inativo</span>
  </div>

  <!-- SELEÇÃO DE GATEWAY -->
  <div id="gwSelecao">
    <div style="font-size:0.8rem;font-weight:700;color:var(--txt2);margin-bottom:0.65rem;letter-spacing:1px;text-transform:uppercase;">Escolha seu gateway de pagamento</div>
    <div class="gw-grid" id="gwGrid"></div>
  </div>

  <!-- GATEWAY SELECIONADO -->
  <div class="gw-selected-bar" id="gwBar">
    <div class="gw-sel-icon" id="gwBarIcon"></div>
    <div class="gw-sel-info">
      <div class="gw-sel-name" id="gwBarName"></div>
      <div class="gw-sel-sub" id="gwBarSub"></div>
    </div>
    <button class="gw-trocar" onclick="trocarGateway()">Trocar</button>
  </div>

  <!-- ABAS -->
  <div id="abasWrap" style="display:none;">
    <div class="tab-row">
      <button class="tab active" onclick="trocarAba('config',this)">Configuração</button>
      <button class="tab" onclick="trocarAba('passos',this)">Como obter</button>
      <button class="tab" onclick="trocarAba('metodos',this)">Métodos</button>
      <button class="tab" onclick="trocarAba('taxas',this)">Taxas</button>
    </div>
    <div id="abaContent"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="pagamento.js"></script>
</body>
</html>
